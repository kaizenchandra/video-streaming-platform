<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta content="width=device-width" name="viewport">
<title>Streamworks</title>
<style>body {
    font: 16px system-ui;
    background: #111827;
    color: #e5e7eb;
    margin: 3rem auto;
    max-width: 960px;
    padding: 1rem
}

button, input, select {
    padding: .7rem;
    margin: .3rem;
    border-radius: 6px
}

video {
    width: 100%;
    background: black
}

article {
    padding: 1rem;
    border: 1px solid #374151;
    margin: 1rem 0
}

#status {
    white-space: pre-wrap
}

a {
    color: #93c5fd
}</style>
<h1>Streamworks</h1>
<p>Creator uploads and adaptive video on demand</p>
<input aria-label="Development identity" id="user" value="creator">
<button id="login">Development sign in</button>
<input aria-label="Access token" id="token" placeholder="Or paste OIDC access token">
<button id="useToken">Use token</button>
<h2>Upload</h2><input id="title" placeholder="Video title"><input accept="video/*" id="file" type="file">
<button id="upload">Upload video</button>
<progress id="progress" max="100" value="0"></progress>
<h2>Catalog</h2><input id="query" placeholder="Search">
<button id="search">Search</button>
<button id="mine">My videos</button>
<button id="recommend">For you</button>
<button id="reviewQueue">Review queue</button>
<div id="catalog"></div>
<h2 id="playing">Player</h2>
<video controls id="video" playsinline></video>
<select aria-label="Video quality" id="quality">
    <option value="-1">Auto quality</option>
</select>
<button id="like">Like</button>
<input id="comment" placeholder="Comment">
<button id="post">Post comment</button>
<pre id="status" role="status"></pre>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script src="app.js"></script>
</html>
