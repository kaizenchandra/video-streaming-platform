global:
  scrape_interval: 15s
scrape_configs:
  - job_name: streaming-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'api:8080' ]
  - job_name: streaming-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'worker:8080' ]
rule_files: [ /etc/prometheus/alerts.yml ]
