groups:
  - name: streaming
    rules:
      - alert: StreamingApiErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),1) > 0.01
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Streaming API error ratio exceeds one percent" }
      - alert: StreamingQueueBacklog
        expr: streaming_jobs_queued > 100
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Processing queue backlog; check worker capacity" }
      - alert: StreamingScratchCleanupFailed
        expr: streaming_scratch_cleanup_errors > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Scratch cleanup deferred; inspect volume permissions, locks, database and legal holds" }
