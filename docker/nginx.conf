server {
 listen 80;
 resolver 127.0.0.11 valid=10s ipv6=off;
 client_max_body_size 1m;
 location / { root /usr/share/nginx/html; try_files $uri /index.html; }
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /dev/ { proxy_pass http://api:8080; }
 location = /_authorize {
  internal;
  proxy_pass http://api:8080/internal/media-auth;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
 }
 location /media/ {
  auth_request /_authorize;
  auth_request_set $storage_url $upstream_http_x_storage_url;
  proxy_pass $storage_url;
  proxy_set_header Host storage:4566;
  proxy_set_header Cookie "";
  proxy_hide_header Cache-Control;
  add_header Cache-Control "private, no-store" always;
  # Local strict-revocation origin: authorize every request; no shared cache.
 }
}
