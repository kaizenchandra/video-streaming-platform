name: streaming
x-app: &app
  build:
    context: .
    target: api
  environment: &env
    DB_URL: jdbc:postgresql://postgres:5432/streaming
    DB_PASSWORD: local-development-only
    S3_ENDPOINT: http://storage:4566
    S3_PUBLIC_ENDPOINT: http://localhost:9100
    DEV_AUTH: "true"
    MODERATION_AUTO_APPROVE: "true"
    MEDIA_SCAN_MODE: disabled
    MEDIA_SCRATCH_MIN_FREE_BYTES: ${MEDIA_SCRATCH_MIN_FREE_BYTES:-53687091200}
    ERASURE_ENABLED: "true"
    AUTH_SECRET: local-development-secret-at-least-32-bytes-long
  depends_on:
    postgres:
      condition: service_healthy
    storage:
      condition: service_healthy
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: local-development-only
    ports: [ "127.0.0.1:5544:5432" ]
    volumes: [ "db:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streaming" ]
      interval: 3s
      retries: 30
  storage:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
    ports: [ "127.0.0.1:9100:4566" ]
    volumes:
      - ./docker/init-storage.sh:/etc/localstack/init/ready.d/init.sh:ro
      - objects:/var/lib/localstack
    healthcheck:
      test: [ "CMD-SHELL", "awslocal s3api head-bucket --bucket media" ]
      interval: 5s
      retries: 30
  api:
    <<: *app
    ports: [ "127.0.0.1:8181:8080" ]
    mem_limit: 768m
    cpus: 2
  worker:
    <<: *app
    build:
      context: .
      target: worker
    environment:
      <<: *env
      DEV_AUTH: "false"
      WORKER_ENABLED: "true"
    volumes: [ "scratch:/tmp/streaming" ]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
  web:
    image: nginx:1.28-alpine
    ports: [ "127.0.0.1:8090:80" ]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-player:/usr/share/nginx/html:ro
    depends_on: [ api ]
volumes:
  db:
  objects:
  scratch:
