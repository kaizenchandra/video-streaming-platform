# Starting manifests: create streaming-config Secret and supply externally managed DB/S3/OIDC first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: streaming-api }
  template:
    metadata:
      labels: { app: streaming-api }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: streaming-api:1.0.0
          envFrom: [ { secretRef: { name: streaming-config } } ]
          env:
            - { name: DEV_AUTH, value: "false" }
            - { name: WORKER_ENABLED, value: "false" }
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 20 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] }, seccompProfile: { type: RuntimeDefault } }
          volumeMounts: [ { name: temp, mountPath: /tmp } ]
      volumes: [ { name: temp, emptyDir: { sizeLimit: 1Gi } } ]
---
apiVersion: v1
kind: Service
metadata: { name: streaming-api }
spec:
  selector: { app: streaming-api }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: streaming-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: streaming-worker }
  template:
    metadata:
      labels: { app: streaming-worker }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: streaming-worker:1.0.0
          envFrom: [ { secretRef: { name: streaming-config } } ]
          env:
            - { name: WORKER_ENABLED, value: "true" }
            - { name: DEV_AUTH, value: "false" }
          resources:
            requests: { cpu: "2", memory: 2Gi, ephemeral-storage: 60Gi }
            limits: { cpu: "2", memory: 3Gi, ephemeral-storage: 80Gi }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 20 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] }, seccompProfile: { type: RuntimeDefault } }
          volumeMounts: [ { name: scratch, mountPath: /tmp } ]
      volumes: [ { name: scratch, emptyDir: { sizeLimit: 75Gi } } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: streaming-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: streaming-api }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: streaming-api }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: streaming-api }

---
apiVersion: v1
kind: ConfigMap
metadata: { name: streaming-web }
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Streamworks</title>
    <style>body {
        font: 16px system-ui;
        background: #111827;
        color: #e5e7eb;
        margin: 3rem auto;
        max-width: 960px;
        padding: 1rem
    }
    
    button, input, select {
        padding: .7rem;
        margin: .3rem;
        border-radius: 6px
    }
    
    video {
        width: 100%;
        background: black
    }
    
    article {
        padding: 1rem;
        border: 1px solid #374151;
        margin: 1rem 0
    }
    
    #status {
        white-space: pre-wrap
    }
    
    a {
        color: #93c5fd
    }</style>
    <h1>Streamworks</h1>
    <p>Creator uploads and adaptive video on demand</p>
    <input id="user" value="creator" aria-label="Development identity">
    <button id="login">Development sign in</button>
    <input id="token" placeholder="Or paste OIDC access token" aria-label="Access token">
    <button id="useToken">Use token</button>
    <h2>Upload</h2><input id="title" placeholder="Video title"><input id="file" type="file" accept="video/*">
    <button id="upload">Upload video</button>
    <progress id="progress" max="100" value="0"></progress>
    <h2>Catalog</h2><input id="query" placeholder="Search">
    <button id="search">Search</button>
    <button id="mine">My videos</button>
    <button id="recommend">For you</button>
    <button id="reviewQueue">Review queue</button>
    <div id="catalog"></div>
    <h2 id="playing">Player</h2>
    <video id="video" controls playsinline></video>
    <select id="quality" aria-label="Video quality">
        <option value="-1">Auto quality
        </option>
    </select>
    <button id="like">Like</button>
    <input id="comment" placeholder="Comment">
    <button id="post">Post comment</button>
    <pre id="status" role="status"></pre>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
    <script src="app.js"></script>
    </html>
  app.js: |
    const $ = id => document.getElementById(id);
    let token = '', active = null, hls = null, session = null, seq = 0;
    const status = x => $('status').textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
    
    async function api(path, method = 'GET', body, headers = {}) {
        const r = await fetch('/api/v1' + path, {method,
            headers: {Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...headers},
            body: body === undefined ? undefined : JSON.stringify(body)});
        if (!r.ok) throw Error(await r.text());
        return r.status === 204 || r.headers.get('content-length') === '0' ? null : r.text().then(t => t ? JSON.parse(t) : null);
    }
    
    async function catalog(path = '/videos') {
        try {
            const rows = await api(path);
            $('catalog').replaceChildren();
            for (const v of rows) {
                let a = document.createElement('article'), title = document.createElement('strong');
                title.textContent = v.title + ' • ' + (v.state || v.category || '');
                a.append(title);
                const play = document.createElement('button');
                play.textContent = 'Play';
                play.onclick = () => start(v.id, path === '/moderation/videos').catch(status);
                a.append(play);
                if (v.state === 'READY' && v.moderation_status === 'APPROVED' && !v.published) {
                    let pub = document.createElement('button');
                    pub.textContent = 'Publish';
                    pub.onclick = async () => {
                        try {
                            let full = await api('/videos/' + v.id);
                            await api('/videos/' + v.id, 'PATCH', {
                                title: full.title,
                                description: full.description,
                                category: full.category,
                                tags: full.tags,
                                visibility: full.visibility,
                                published: true
                            }, {'If-Match': String(full.version)});
                            await catalog('/users/me/videos');
                        } catch (e) {
                            status(e.message)
                        }
                    };
                    a.append(pub)
                }
                if (path === '/moderation/videos') {
                    for (const decision of ['APPROVED', 'REJECTED']) {
                        const button = document.createElement('button');
                        button.textContent = decision === 'APPROVED' ? 'Approve' : 'Reject';
                        button.onclick = async () => {
                            const reason = prompt('Review reason');
                            if (!reason) return;
                            try {
                                await api('/videos/' + v.id + '/moderation-decisions', 'POST', {attempt: v.current_attempt,
                                    decision,
                                    reason}, {
                                    'If-Match': String(v.version)
                                });
                                await catalog('/moderation/videos')
                            } catch (e) {
                                status(e.message)
                            }
                        };
                        a.append(button)
                    }
                }
                $('catalog').append(a)
            }
        } catch (e) {
            status(e.message)
        }
    }
    
    $('login').onclick = async () => {
        try {
            token = (await (await fetch('/dev/token?user=' + encodeURIComponent($('user').value), {method: 'POST'})).json()).token;
            await catalog()
        } catch (e) {
            status(e.message)
        }
    };
    $('useToken').onclick = () => {
        token = $('token').value;
        catalog()
    };
    $('search').onclick = () => catalog('/search/videos?q=' + encodeURIComponent($('query').value));
    $('mine').onclick = () => catalog('/users/me/videos');
    $('recommend').onclick = () => catalog('/videos/recommendations');
    $('reviewQueue').onclick = () => catalog('/moderation/videos');
    $('upload').onclick = async () => {
        try {
            let f = $('file').files[0];
            if (!f) throw Error('Choose a video');
            if (f.size > 256 * 1024 * 1024) throw Error('Browser demo checksum limit: 256 MiB; use scripts/upload.py for large files');
            status('Computing checksum…');
            let digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', await f.arrayBuffer()))).map(b => b.toString(16).padStart(2, '0')).join('');
            let v = await api('/videos', 'POST', {title: $('title').value || f.name,
                description: '',
                category: 'general',
                tags: '',
                visibility: 'PUBLIC',
                published: false});
            let u = await api('/videos/uploads', 'POST', {videoId: v.id,
                bytes: f.size,
                sha256: digest}, {'Idempotency-Key': crypto.randomUUID()});
            const chunk = 8 * 1024 * 1024, count = Math.ceil(f.size / chunk);
            for (let n = 1; n <= count; n++) {
                const [part] = await api('/videos/uploads/' + u.id + '/parts', 'POST', {first: n, count: 1});
                const response = await fetch(part.url, {method: 'PUT', body: f.slice((n - 1) * chunk, n * chunk)});
                if (!response.ok) throw Error('Part failed; durable upload ID: ' + u.id);
                $('progress').value = 100 * n / count;
            }
            await api('/videos/uploads/' + u.id + '/complete', 'POST');
            status('Upload complete. Processing started; refresh My videos to publish when READY.');
            catalog('/users/me/videos')
        } catch (e) {
            status(e.message)
        }
    };
    
    async function start(id, review = false) {
        active = id;
        seq = 0;
        session = await api('/videos/' + id + (review ? '/review-playback-sessions' : '/playback-sessions'), 'POST');
        const video = $('video');
        if (hls) hls.destroy();
        $('quality').innerHTML = '<option value="-1">Auto quality</option>';
        if (window.Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(session.manifest);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                hls.levels.forEach((l, i) => {
                    let o = document.createElement('option');
                    o.value = i;
                    o.textContent = l.height ? l.height + 'p' : Math.round(l.bitrate / 1000) + ' kbps';
                    $('quality').append(o)
                });
                video.currentTime = session.resume;
                video.play().catch(() => {
                })
            });
            hls.on(Hls.Events.ERROR, (_, d) => {
                if (d.fatal) status('Playback failed: ' + d.details + '; restart playback to renew credentials')
            })
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = session.manifest;
            video.onloadedmetadata = () => {
                video.currentTime = session.resume;
                video.play().catch(() => {
                })
            }
        } else throw Error('HLS unsupported in this browser');
        status('Playback authorized')
    }
    
    $('quality').onchange = () => {
        if (hls) hls.currentLevel = Number($('quality').value)
    };
    
    async function progress() {
        if (!session || $('video').paused) return;
        try {
            await api('/videos/' + active + '/watch-progress', 'PUT', {
                sessionId: session.sessionId,
                sequence: seq++,
                position: $('video').currentTime,
                completed: $('video').ended
            })
        } catch (e) {
            status(e.message)
        }
    }
    
    setInterval(progress, 15000);
    $('video').onended = () => {
        if (session) api('/videos/' + active + '/watch-progress', 'PUT', {
            sessionId: session.sessionId, sequence: seq++, position: $('video').currentTime, completed: true
        }).catch(e => status(e.message))
    };
    $('like').onclick = () => api('/videos/' + active + '/likes/me', 'PUT').then(() => status('Liked')).catch(e => status(e.message));
    $('post').onclick = () => api('/videos/' + active + '/comments', 'POST', {body: $('comment').value}).then(status).catch(e => status(e.message));
  default.conf: |
    server {
     listen 80;
     resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
     client_max_body_size 1m;
     location / { root /usr/share/nginx/html; try_files $uri /index.html; }
     location /api/ { proxy_pass http://streaming-api:8080; proxy_set_header Host $host; }
     location /dev/ { proxy_pass http://streaming-api:8080; }
     location = /_authorize {
      internal;
      proxy_pass http://streaming-api:8080/internal/media-auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
     }
     location /media/ {
      auth_request /_authorize;
      auth_request_set $storage_url $upstream_http_x_storage_url;
      proxy_pass $storage_url;
      proxy_set_header Host storage:4566;
      proxy_set_header Cookie "";
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      # Local strict-revocation origin: authorize every request; no shared cache.
     }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: streaming-web }
spec:
  replicas: 2
  selector: { matchLabels: { app: streaming-web } }
  template:
    metadata: { labels: { app: streaming-web } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports: [ { containerPort: 80 } ]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: web, mountPath: /usr/share/nginx/html/app.js, subPath: app.js }
            - { name: web, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes: [ { name: web, configMap: { name: streaming-web } } ]
---
apiVersion: v1
kind: Service
metadata: { name: streaming-web }
spec:
  selector: { app: streaming-web }
  ports: [ { port: 80, targetPort: 80 } ]
